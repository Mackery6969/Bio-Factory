pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = "NeoForged"
			url = uri("https://maven.neoforged.net/releases")
			content {
				includeGroup("net.neoforged")
			}
		}
		mavenCentral()
	}

	plugins {
		id 'net.neoforged.moddev' version '2.0.146'
		id 'net.neoforged.moddev.repositories' version '2.0.146'
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	id 'net.neoforged.moddev.repositories'
}

def biomancyRepoPath = providers.gradleProperty("biomancy_repo")
		.getOrElse("${rootDir}/../BiomancyPort/repo")
def biomancyRepoUrl = biomancyRepoPath.startsWith("file:") ? biomancyRepoPath : new File(biomancyRepoPath).toURI().toString()

dependencyResolutionManagement {
	repositoriesMode = RepositoriesMode.PREFER_SETTINGS

	repositories {
		maven {
			name = "Biomancy (local publish)"
			url = uri(biomancyRepoUrl)
			content {
				includeGroup("com.github.elenterius")
			}
		}
		maven {
			name = "NeoForged"
			url = uri("https://maven.neoforged.net/releases")
			content {
				includeGroup("net.neoforged")
			}
		}
		maven {
			name = "ParchmentMC"
			url = uri("https://maven.parchmentmc.org")
			content {
				includeGroup("org.parchmentmc.data")
			}
		}
		maven {
			name = "CreateMod"
			url = uri("https://maven.createmod.net")
			content {
				includeGroup("com.simibubi.create")
				includeGroup("net.createmod")
				includeGroup("net.createmod.ponder")
				includeGroup("net.createmod.catnip")
				includeGroup("dev.engine-room.flywheel")
			}
		}
		maven {
			name = "iThundxr (Registrate)"
			url = uri("https://maven.ithundxr.dev/snapshots")
			content {
				includeGroup("com.tterrag.registrate")
			}
		}
		maven {
			name = 'Geckolib'
			url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
			content {
				includeGroup("software.bernie.geckolib")
				includeGroup("com.eliotlash.mclib")
			}
		}
		maven { url = 'https://maven.blamejared.com' }
		maven {
			name = 'tterrag maven'
			url = 'https://maven.tterrag.com/'
		}
		mavenCentral()
	}
}

rootProject.name = 'Bio-Factory'
