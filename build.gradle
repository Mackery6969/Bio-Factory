plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev'
	id 'idea'
}

version = mod_version
group = mod_group_id

base {
	archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets {
	main {
		resources {
			srcDir 'src/generated/resources'
			exclude '.cache/'
		}
	}
	datagen {}
}

neoForge {
	version = project.neoforge_version

	parchment {
		mappingsVersion = project.parchment_mappings_version
		minecraftVersion = project.parchment_minecraft_version
	}

	addModdingDependenciesTo sourceSets.datagen

	runs {
		client {
			client()
			gameDirectory = project.file('runs/client')
			systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
		}

		server {
			server()
			gameDirectory = project.file('runs/server')
			programArgument '--nogui'
			systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
		}

		data {
			data()
			gameDirectory = project.file('runs/data')

			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

			mods {
				"${mod_id}" {
					sourceSet(sourceSets.datagen)
				}
			}
		}

		configureEach {
			systemProperty('neoforge.logging.markers', 'REGISTRIES')
			logLevel = org.slf4j.event.Level.DEBUG
			systemProperty('geckolib.disable_examples', 'true')
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

configurations {
	datagenImplementation.extendsFrom implementation
	devRuntimeOnly
	runtimeClasspath.extendsFrom devRuntimeOnly
}

dependencies {
	implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
		exclude group: 'net.neoforged', module: 'neoforge'
		// Create 6.0.10's published POM leaks its optional-mod compat deps as runtime
		// deps (6.0.11+ dropped them). We don't have repos for these and don't need them.
		exclude group: 'maven.modrinth'
		exclude group: 'dev.ftb.mods'
		exclude group: 'info.journeymap'
		exclude group: 'dev.engine-room.vanillin'
		exclude group: 'top.theillusivec4.curios'
		exclude group: 'cc.tweaked'
		exclude group: 'dev.architectury'
	}
	implementation("com.tterrag.registrate:Registrate:${registrate_version}")
	implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}")
	compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")

	implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")

	implementation("com.github.elenterius:Biomancy:${biomancy_version}") {
		transitive = false
	}

	// Recipe viewer for dev runs only. It has to land on runtimeClasspath, not
	// additionalRuntimeClasspath: the latter is the library path, which FML never
	// scans for mods, so EMI would load as a plain jar and never register itself.
	// devRuntimeOnly is not one of the java component's published variants, so this
	// stays out of the POM published to maven.mackery.com.
	devRuntimeOnly("dev.emi:emi-neoforge:${emi_version}")

	datagenImplementation sourceSets.main.output
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			minecraft_version      : minecraft_version,
			minecraft_version_range: minecraft_version_range,
			neoforge_version       : neoforge_version,
			neoforge_version_range : neoforge_version_range,
			loader_version_range   : loader_version_range,

			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_authors            : mod_authors,
			mod_credits            : mod_credits,
			mod_description        : mod_description,
			mod_url                : mod_url,
			mod_issue_url          : mod_issue_url,
			mod_update_url         : mod_update_url,

			create_version_range   : create_version_range,
			biomancy_version_range : biomancy_version_range,
			geckolib_version_range : geckolib_version_range,
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			url = layout.projectDirectory.dir("repo").asFile.toURI()
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
